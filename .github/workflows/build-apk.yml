name: Build My Liquid OS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug keystore and env
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare release APK copy
        run: cp app/build/outputs/apk/debug/app-debug.apk My-Liquid-OS.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: My-Liquid-OS-APK
          path: My-Liquid-OS.apk

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: My Liquid OS (Android 11+ APK)
          body: |
            Direct installable APK for **My Liquid OS** (Android 11 / Galaxy A03s compatible).
          files: My-Liquid-OS.apk
